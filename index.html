<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turoasis: experiencias inolvidables, viajes diseñados para ti." />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=location_on,calendar_today,schedule,language,phone,mail" />
    <title>Turoasis | Experiencias inolvidables</title>
    <style>#google_translate_element{display:none!important}.goog-te-banner-frame.skiptranslate{display:none!important}body{top:0!important}.goog-tooltip{display:none!important}</style>
    <style>.language-menu{position:relative}.language-menu .language-option{display:none}.language-menu.open .language-option{display:block;position:absolute;right:0;top:calc(100% + 10px);z-index:30;min-width:105px;padding:9px 12px;background:#fff;border:1px solid #dce8e3;border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.12);text-align:left;color:#173735}.language-menu.open .language-option:hover{color:#09a86f}.language-menu .language-divider{display:none}</style>
    <script>
      function GTranslateFireEvent(element, eventName) {
        try { const event = document.createEvent('HTMLEvents'); event.initEvent(eventName, true, true); element.dispatchEvent(event) } catch (error) {}
      }
      function doGTranslate(languagePair) {
        const language = languagePair.split('|')[1]
        const select = document.querySelector('.goog-te-combo')
        if (select) { select.value = language; GTranslateFireEvent(select, 'change') }
      }
  </head>
  <body>
    <div id="app"></div>
    <div id="google_translate_element" aria-hidden="true"></div>
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({ pageLanguage: 'es', includedLanguages: 'es,en', autoDisplay: false }, 'google_translate_element')
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
